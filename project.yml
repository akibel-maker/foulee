# Projet Xcode généré avec XcodeGen : `brew install xcodegen && xcodegen`
name: RunTracker
options:
  bundleIdPrefix: com.akibel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Renseigne ton Team ID Apple ici (ou choisis l'équipe dans Xcode > Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
targets:
  RunTracker:
    type: application
    platform: iOS
    sources:
      - RunTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akibel.runtracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: RunTracker/RunTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: RunTracker/Info.plist
      properties:
        CFBundleDisplayName: Foulée
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "Foulée utilise ta position pour enregistrer le tracé, la distance et l'allure de tes courses."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Foulée continue d'enregistrer ta course quand l'iPhone est verrouillé."
        NSMotionUsageDescription: "Foulée utilise le podomètre pour mesurer ta cadence (pas par minute)."
        NSHealthShareUsageDescription: "Foulée lit tes courses, ta fréquence cardiaque et ton poids dans Santé pour compléter ton historique."
        NSHealthUpdateUsageDescription: "Foulée enregistre tes courses (distance, tracé, calories) dans Santé."
